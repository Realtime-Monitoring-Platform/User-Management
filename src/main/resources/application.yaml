server:
  port: 9003


spring:
  application:
    name: user_manag
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: chedly
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    config:
      enabled: false


grpc:
  client:
    tenant-service:
      address: static://localhost:9095
      negotiationType: plaintext