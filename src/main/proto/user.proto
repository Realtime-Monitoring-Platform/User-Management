syntax = "proto3";


option java_multiple_files=true;

option java_package="com.realtime_monitoring.usermanag.grpc";

service UserService {
    rpc GetUserById(GetUserRequest) 
    returns (GetUserResponse);
}

message GetUserRequest {
    string id =  1 ;
}

message GetUserResponse {
    string id = 1;
    string username =2;
    string email = 3;
    string tenantId = 4;
    bool enabled = 5;
    string role = 6;
    repeated string permissions = 7;
    string phone = 8;
    string teamName = 9;
    string address = 10;
    string firstName = 11;
    string lastName = 12;

}